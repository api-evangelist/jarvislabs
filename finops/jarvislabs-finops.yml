- FinOps
- Cost Management
- FOCUS
description: >-
  FinOps view of JarvisLabs.ai spend. JarvisLabs bills usage-based per-GPU-hour
  rates for GPU instances and per-hour rates for CPU VMs, metered per minute of
  active compute. Persistent storage is billed per GB per month and survives
  pause/resume; egress is free within region. Pausing an instance stops compute
  billing while retaining storage, making pause/resume the primary cost lever.
notes: >-
  Per-GPU-hour rates are subject to change and vary by region and availability;
  verify against the JarvisLabs pricing page during reconciliation.
sources:
- https://jarvislabs.ai/pricing
- https://docs.jarvislabs.ai/
- https://focus.finops.org/focus-specification/v1-3/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: JarvisLabs
serviceCategory: Compute and GPU Cloud
billingModel:
  pricingCategory: Usage-Based
  billingFrequency: PrepaidWallet
  billingCurrency: USD
  chargeCategories:
  - Usage
  - Purchase
  - Adjustment
focusColumns:
  ServiceName: JarvisLabs GPU Cloud
  ServiceCategory: Compute and GPU Cloud
  ProviderName: JarvisLabs
  PublisherName: JarvisLabs
  InvoiceIssuerName: JarvisLabs
  BillingCurrency: USD
  ChargeCategory: Usage
  PricingCategory: Usage-Based
meters:
- name: gpu_hours
  description: GPU compute time billed per minute at the per-GPU-hour rate for the chosen GPU type.
  unit: hours
  aggregation: sum
  dimensions:
  - account
  - gpu_type
  - region
  - instance
- name: cpu_vm_hours
  description: CPU VM compute time billed per minute at the per-hour rate for the chosen VM size.
  unit: hours
  aggregation: sum
  dimensions:
  - account
  - vm_size
  - region
  - instance
- name: storage_gb_months
  description: Persistent storage billed per GB per month; retained while instances are paused.
  unit: gb-months
  aggregation: sum
  dimensions:
  - account
  - filesystem
  - region
- name: egress_gb
  description: Network egress; free within region.
  unit: gb
  aggregation: sum
  dimensions:
  - account
  - region
principles:
- name: Visibility
  description: Track wallet balance and per-instance cost-per-hour via `jl status` and `jl list`; inspect GPU burn by instance and GPU type.
- name: Allocation
  description: Name instances per workload/team and map GPU-hours and storage to internal cost centers.
- name: Optimization
  description: Pause instances when idle to stop compute billing; right-size GPU type and count; use CPU VMs for non-GPU steps; use managed runs that auto-pause on completion; pick cheaper GPUs (A30/L4) when sufficient.
- name: Accountability
  description: Assign owners per project; review GPU-hour and storage spend against the wallet budget regularly.
maintainers:
