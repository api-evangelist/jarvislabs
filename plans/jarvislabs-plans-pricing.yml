  - label: A30 (24GB)
    name: gpu_a30
    type: usage
    metric: gpu_hours
    limit: -1
    timeFrame: hour
    geo: global
    unit: 1
    price: $0.41 per GPU-hour
    userMultiplied: false
  - label: Persistent Storage
    name: storage
    type: usage
    metric: gb
    limit: -1
    timeFrame: month
    geo: global
    unit: 1
    price: $0.10 per GB per month
    userMultiplied: false
  - label: Egress (within region)
    name: egress
    type: usage
    metric: gb
    limit: -1
    timeFrame: month
    geo: global
    unit: 1
    price: free within region
    userMultiplied: false
  elements:
