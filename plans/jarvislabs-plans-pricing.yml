specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: JarvisLabs
providerId: jarvislabs
created: '2026-06-21'
modified: '2026-06-21'
reconciled: true
tags:
- AI
- GPU
- Cloud
- Infrastructure
- Compute
- Plans
description: >-
  JarvisLabs.ai uses a transparent pay-as-you-go model billed per minute of
  compute at published per-GPU-hour rates, with separate per-vCPU-hour rates
  for CPU VMs and a flat per-GB-per-month rate for persistent storage. Pausing
  an instance stops compute billing while retaining storage. There are no
  formal Free / Developer / Enterprise tiers; users recharge a wallet and pay
  for actual usage. The jarvislabs SDK and jl CLI are free.
notes: >-
  Representative on-demand rates as published on the JarvisLabs pricing page;
  GPU availability and rates vary by region and change over time. Storage is
  billed at $0.10/GB per month; egress is free within region.
sources:
- https://jarvislabs.ai/pricing
- https://docs.jarvislabs.ai/
plans:
- id: jarvislabs-pay-as-you-go
  name: Pay-as-you-go
  type: usage
  description: >-
    On-demand GPU and CPU instances billed per minute at published
    per-hour rates, with no monthly minimum.
  entries:
  - label: H100 SXM (80GB)
    name: gpu_h100_sxm
    type: usage
    metric: gpu_hours
    limit: -1
    timeFrame: hour
    geo: global
    unit: 1
    price: $2.69 per GPU-hour
    userMultiplied: false
  - label: RTX Pro 6000 Blackwell (96GB)
    name: gpu_rtx_pro_6000
    type: usage
    metric: gpu_hours
    limit: -1
    timeFrame: hour
    geo: global
    unit: 1
    price: $1.89 per GPU-hour
    userMultiplied: false
  - label: A100 (80GB)
    name: gpu_a100_80gb
    type: usage
    metric: gpu_hours
    limit: -1
    timeFrame: hour
    geo: global
    unit: 1
    price: $1.49 per GPU-hour
    userMultiplied: false
  - label: A100 (40GB)
    name: gpu_a100_40gb
    type: usage
    metric: gpu_hours
    limit: -1
    timeFrame: hour
    geo: global
    unit: 1
    price: $0.89 per GPU-hour
    userMultiplied: false
  - label: L4 (24GB)
    name: gpu_l4
    type: usage
    metric: gpu_hours
    limit: -1
    timeFrame: hour
    geo: global
    unit: 1
