aid: jarvislabs
url: https://raw.githubusercontent.com/api-evangelist/jarvislabs/refs/heads/main/apis.yml
name: JarvisLabs
kind: company
description: JarvisLabs.ai is a GPU cloud for AI development that lets you launch on-demand
  GPU and CPU instances (H100, H200, A100, RTX Pro 6000, A6000, A5000, L4, A30) from
  the terminal. Its Python SDK (jarvislabs / legacy jlclient) and jl CLI wrap an API
  for the full instance lifecycle - create, pause, resume, and destroy - plus GPU type
  discovery, framework templates, persistent filesystems, and managed runs for
  training and inference workloads, billed per minute of compute.
